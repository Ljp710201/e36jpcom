<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>밸런스 케어 전정재활 센터 차트</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <style>
        body { font-family: 'Malgun Gothic', sans-serif; background: #f8fafc; padding: 40px; }
        .chart-wrapper { background: white; border-radius: 16px; padding: 32px; margin-bottom: 48px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); max-width: 700px; }
        h2 { color: #0f766e; margin-bottom: 8px; }
        p  { color: #64748b; font-size: 0.9rem; margin-bottom: 24px; }
        canvas { max-height: 350px; }
    </style>
</head>
<body>

    <div class="chart-wrapper" id="barWrapper">
        <h2>📅 월별 매출 추이</h2>
        <p>밸런스 케어 전정재활 센터 | 2025-12 ~ 2026-02</p>
        <canvas id="barChart"></canvas>
    </div>

    <div class="chart-wrapper" id="pieWrapper">
        <h2>🏥 증상 유형별 방문 비중</h2>
        <p>밸런스 케어 전정재활 센터 | 2025-12 ~ 2026-02</p>
        <canvas id="pieChart"></canvas>
    </div>

    <script>
        /* ── 1. 월별 매출 막대 차트 ── */
        const barCtx = document.getElementById('barChart');
        new Chart(barCtx, {
            type: 'bar',
            data: {
                labels: ['2025년 12월', '2026년 1월', '2026년 2월'],
                datasets: [{
                    label: '월별 매출액 (원)',
                    data: [2490000, 2610000, 2370000],
                    backgroundColor: [
                        'rgba(15, 118, 110, 0.8)',
                        'rgba(20, 184, 166, 0.8)',
                        'rgba(94, 234, 212, 0.8)'
                    ],
                    borderColor: [
                        '#0f766e', '#14b8a6', '#5eead4'
                    ],
                    borderWidth: 2,
                    borderRadius: 8,
                }]
            },
            options: {
                responsive: true,
                plugins: {
                    legend: { labels: { font: { family: 'Malgun Gothic', size: 13 } } },
                    tooltip: {
                        callbacks: {
                            label: ctx => `  ${ctx.parsed.y.toLocaleString()}원`
                        }
                    }
                },
                scales: {
                    y: {
                        beginAtZero: true,
                        ticks: {
                            callback: v => (v / 10000).toFixed(0) + '만원',
                            font: { family: 'Malgun Gothic' }
                        }
                    },
                    x: {
                        ticks: { font: { family: 'Malgun Gothic' } }
                    }
                }
            }
        });

        /* ── 2. 증상 유형 파이 차트 ── */
        const pieCtx = document.getElementById('pieChart');
        new Chart(pieCtx, {
            type: 'doughnut',
            data: {
                labels: ['이석증(BPPV)', '만성어지럼증', '전정신경염', '낙상불안'],
                datasets: [{
                    data: [22, 13, 13, 12],
                    backgroundColor: [
                        'rgba(15, 118, 110, 0.85)',
                        'rgba(20, 184, 166, 0.85)',
                        'rgba(94, 234, 212, 0.85)',
                        'rgba(153, 246, 228, 0.85)'
                    ],
                    borderColor: '#ffffff',
                    borderWidth: 3
                }]
            },
            options: {
                responsive: true,
                plugins: {
                    legend: {
                        position: 'right',
                        labels: { font: { family: 'Malgun Gothic', size: 13 }, padding: 16 }
                    },
                    tooltip: {
                        callbacks: {
                            label: ctx => `  ${ctx.label}: ${ctx.parsed}건 (${(ctx.parsed / 60 * 100).toFixed(1)}%)`
                        }
                    }
                }
            }
        });
    </script>
</body>
</html>
